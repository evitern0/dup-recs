<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- dup recs logo: two-story house + vinyl record -->

  <!-- House body -->
  <g>
    <!-- Roof -->
    <path d="M 90 150 L 200 70 L 310 150 L 290 150 L 290 160 L 110 160 L 110 150 Z" fill="#1f2328"/>

    <!-- House body (two stories) -->
    <rect x="110" y="150" width="180" height="150" fill="#1f2328"/>

    <!-- Floor divider line -->
    <rect x="110" y="222" width="180" height="6" fill="#faf6f0"/>

    <!-- Ground floor door -->
    <rect x="184" y="256" width="32" height="44" fill="#faf6f0"/>

    <!-- Ground floor small windows -->
    <rect x="130" y="256" width="28" height="28" fill="#faf6f0"/>
    <rect x="242" y="256" width="28" height="28" fill="#faf6f0"/>
  </g>

  <!-- Vinyl record as the second-story window -->
  <g>
    <circle cx="200" cy="188" r="34" fill="#faf6f0"/>
    <circle cx="200" cy="188" r="34" fill="none" stroke="#1f2328" stroke-width="1.5" opacity="0.15"/>
    <circle cx="200" cy="188" r="27" fill="none" stroke="#1f2328" stroke-width="1.5" opacity="0.35"/>
    <circle cx="200" cy="188" r="19" fill="none" stroke="#1f2328" stroke-width="1.5" opacity="0.35"/>
    <circle cx="200" cy="188" r="11" fill="#d6472b"/>
    <circle cx="200" cy="188" r="2.5" fill="#faf6f0"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="352" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="4" fill="#1f2328" text-anchor="middle">dup recs</text>
</svg>
